<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <radialGradient id="bgGrad" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1d6b42"/>
      <stop offset="100%" stop-color="#0a3322"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#001f1c" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="160" cy="160" r="160" fill="url(#bgGrad)"/>

  <!-- Subtle inner ring -->
  <circle cx="160" cy="160" r="148" fill="none" stroke="#2a6847" stroke-width="1.5" opacity="0.5"/>

  <!-- Golf flag pin -->
  <line x1="160" y1="95" x2="160" y2="230" stroke="#d0e8d8" stroke-width="5" stroke-linecap="round"/>

  <!-- Flag -->
  <path d="M160 95 L220 118 L160 141 Z" fill="#aed4bc" filter="url(#shadow)"/>

  <!-- Hole / green circle at base -->
  <ellipse cx="160" cy="228" rx="30" ry="8" fill="#2a6847"/>
  <ellipse cx="160" cy="228" rx="18" ry="5" fill="#3a845e"/>

  <!-- "ZB" text removed in favor of cleaner icon — app name below -->
  <text
    x="160"
    y="268"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="26"
    font-weight="700"
    letter-spacing="4"
    fill="#d0e8d8"
    text-anchor="middle"
    opacity="0.9"
  >ZERO BREAK</text>
</svg>
