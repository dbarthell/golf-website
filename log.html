<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Calibrate — ZeroBreak</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="apple-touch-icon" href="images/logo.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0e1b3d">
  <link rel="stylesheet" href="css/log.css">
</head>
<body>

  <div class="log-header">
    <a href="index.html" class="back-link">← Back</a>
    <div class="header-brand">
      <img src="images/logo.png" alt="" class="header-logo">
      <h1>Calibrate</h1>
    </div>
    <div class="header-spacer"></div>
  </div>

  <p class="cal-intro">
    Pick a distance you know well and adjust the backswing until it matches your stroke.
    The app will scale all other distances to match.
  </p>

  <!-- Current status -->
  <div class="status-card" id="status-card">
    <!-- Populated by JS -->
  </div>

  <!-- Calibration tool -->
  <div class="tool-card" id="tool-card">

    <div class="tool-field">
      <label class="tool-label">Green Speed (Stimp)</label>
      <div class="stimp-toggle" id="cal-stimp-toggle">
        <button class="stimp-btn" data-stimp="9">9</button>
        <button class="stimp-btn stimp-btn-active" data-stimp="10">10</button>
        <button class="stimp-btn" data-stimp="10.5">10.5</button>
        <button class="stimp-btn" data-stimp="11">11</button>
        <button class="stimp-btn" data-stimp="11.5">11.5</button>
        <button class="stimp-btn" data-stimp="12">12</button>
      </div>
    </div>

    <div class="tool-field">
      <label class="tool-label">Test Distance</label>
      <div class="dist-chips" id="dist-chips">
        <button class="dist-chip" data-dist="6">6 ft</button>
        <button class="dist-chip dist-chip-active" data-dist="10">10 ft</button>
        <button class="dist-chip" data-dist="15">15 ft</button>
        <button class="dist-chip" data-dist="20">20 ft</button>
        <button class="dist-chip" data-dist="30">30 ft</button>
      </div>
    </div>

    <div class="adjust-area">
      <div class="adjust-col">
        <div class="adjust-label">Baseline</div>
        <div class="adjust-value baseline-val" id="baseline-value">—</div>
      </div>
      <div class="adjust-arrow">→</div>
      <div class="adjust-col">
        <div class="adjust-label">My Backswing</div>
        <div class="adjust-my-row">
          <button class="adj-btn" id="cal-minus">−</button>
          <div class="adjust-value my-val" id="my-value">—</div>
          <button class="adj-btn" id="cal-plus">+</button>
        </div>
      </div>
    </div>

    <button class="save-btn" id="save-cal-btn">Save Calibration</button>
    <button class="reset-btn" id="reset-cal-btn">Reset to Baseline</button>

  </div>

  <!-- Preview table -->
  <div class="preview-card" id="preview-card">
    <h2 class="preview-title">How This Changes Your Numbers</h2>
    <div id="preview-display">
      <!-- Populated by JS -->
    </div>
  </div>

  <script src="js/log.js"></script>
</body>
</html>
